name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # A nightly full run against the deployed environments, which catches drift
    # in either application that no commit of ours would have triggered.
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      uiBaseUrl:
        description: 'Book Store environment to test'
        required: false
        default: 'https://demoqa.com'
      apiBaseUrl:
        description: 'Restful Booker environment to test'
        required: false
        default: 'https://restful-booker.herokuapp.com'
      browsers:
        description: 'Comma separated: chromium, firefox, webkit'
        required: false
        default: 'chromium'
      recordVisualBaselines:
        description: 'Re-record the screenshot baselines and upload them as an artifact'
        required: false
        type: boolean
        default: false

env:
  E2E_BASE_URL: ${{ inputs.uiBaseUrl || vars.E2E_BASE_URL || 'https://demoqa.com' }}
  BOOKER_BASE_URL: ${{ inputs.apiBaseUrl || vars.BOOKER_BASE_URL || 'https://restful-booker.herokuapp.com' }}
  # Both services are shared public deployments that occasionally drop a
  # request. One retry keeps the pipeline usable; the flaky count in the report
  # keeps that honest.
  E2E_RETRIES: '1'
  BOOKER_RETRIES: '1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Everything that needs no browser and no network, so a typo or a weakened
  # test fails in under a minute rather than after the full run.
  verify:
    name: Static checks, unit tests and mutation gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # Stryker's incremental mode compares against the previous commit.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # A workflow is untested code until something checks it. actionlint is
      # the fuller tool and needs Go or Docker, so the pipeline runs it here
      # while the local script falls back to schema validation.
      - name: Lint workflows
        uses: docker://rhysd/actionlint:latest
        with:
          args: -color

      - name: Format
        run: npm run format

      - name: Unit tests
        run: npm run test:unit

      # Both Stryker configs already set `incremental: true`, but the file it
      # keeps lives under `reports/`, which is not committed, so without this
      # every run starts cold and re-mutates everything.
      #
      # The key deliberately hashes the lockfile and both Stryker configs.
      # Incremental mode tracks changes to source and test files and knows
      # nothing about dependencies, so a runner that changes behaviour under a
      # new version carries its old verdicts forward and reports a passing
      # score for a suite that no longer kills anything. That is not
      # hypothetical: it is how the vitest 5 upgrade looked green locally while
      # a cold run scored 22%. A dependency or config change now busts the
      # cache and forces the full run that would have caught it.
      - name: Restore mutation cache
        uses: actions/cache@v6
        with:
          path: packages/*/reports/mutation/stryker-incremental.json
          key: stryker-${{ runner.os }}-${{ hashFiles('package-lock.json', 'packages/*/stryker.config.json') }}-${{ github.sha }}
          restore-keys: |
            stryker-${{ runner.os }}-${{ hashFiles('package-lock.json', 'packages/*/stryker.config.json') }}-

      - name: Mutation gates
        run: npm run test:mutation

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-reports
          path: packages/*/reports/mutation
          retention-days: 14

  # Task 2. Runs alongside the browser suite rather than after it: the two
  # target different services and neither can affect the other.
  api:
    name: API suite (Restful Booker)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # No browsers are installed for this job. That saving is the reason the
      # two suites are separate workspace packages.
      - run: npm ci

      - name: Run API suite
        run: npm run test:api

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-report
          path: packages/api-tests/reports
          retention-days: 14

  # Task 1.
  e2e:
    name: UI suite (${{ matrix.browser }} shard ${{ matrix.shard }}/2)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # Both applications are single shared free deployments. Running all six
      # nightly jobs at once put roughly eighteen concurrent sessions through
      # DemoQA, which pushed authentication past thirteen seconds and page
      # loads past forty-five, so the suite was failing on load it generated
      # itself. Two jobs at a time keeps the fan-out below what the service
      # answers reliably. The cap costs wall-clock on a nightly run and buys a
      # result that measures the application rather than our own traffic.
      max-parallel: 2
      matrix:
        # The nightly run widens to every engine the application supports; a
        # pull request pays only for Chromium.
        browser: ${{ fromJSON(github.event_name == 'schedule' && '["chromium","firefox","webkit"]' || '["chromium"]') }}
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install browser
        run: npx playwright install --with-deps ${{ matrix.browser }}
        working-directory: packages/ui-tests

      # Appearance checks are excluded here and run in the `visual` job below,
      # inside the Docker image, because a screenshot baseline is only valid
      # for the exact rendering stack that produced it. Behaviour is what this
      # job measures, and behaviour does not depend on font rasterisation.
      - name: Run suite
        run: npx playwright test --grep-invert @visual --shard=${{ matrix.shard }}/2
        working-directory: packages/ui-tests
        env:
          E2E_BROWSERS: ${{ matrix.browser }}

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-${{ matrix.browser }}-${{ matrix.shard }}
          path: packages/ui-tests/blob-report
          retention-days: 14

  # Appearance, in the image rather than on the runner.
  #
  # A screenshot baseline is only valid for the rendering stack that produced
  # it: a different font package or freetype build moves glyphs by a pixel and
  # every comparison fails for a reason that is not a regression. Pinning the
  # container pins that stack, so the baselines committed to the repository are
  # the ones this job compares against, whoever runs it and whenever.
  #
  # Building the image here rather than only publishing it also means the
  # Dockerfile is exercised on every run. It is the only thing that proves the
  # container route in the README still works.
  visual:
    name: Appearance (Playwright container)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Build the suite image
        run: docker build -f packages/ui-tests/Dockerfile -t bookstore-ui-tests .

      # The snapshot directory is mounted so a recording run writes the
      # baselines back out where the upload step can collect them. On an
      # ordinary run nothing is written and the mount is inert.
      - name: Run appearance checks
        run: |
          # Built as positional parameters so every expansion stays quoted:
          # an unquoted ${RECORD:+...} is what shellcheck objects to, and
          # quoting it would pass an empty argument on an ordinary run.
          set -- --grep @visual
          if [ -n "${RECORD}" ]; then set -- "$@" --update-snapshots; fi
          docker run --rm \
            -e CI=true \
            -e "E2E_BASE_URL=${E2E_BASE_URL}" \
            -v "${PWD}/packages/ui-tests/tests/visual:/repo/packages/ui-tests/tests/visual" \
            -v "${PWD}/packages/ui-tests/reports:/repo/packages/ui-tests/reports" \
            bookstore-ui-tests "$@"
        env:
          RECORD: ${{ inputs.recordVisualBaselines && '1' || '' }}

      # Only meaningful on a recording run, and harmless otherwise: on an
      # ordinary run the directory is unchanged and the artifact simply matches
      # what is already committed.
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-baselines
          path: packages/ui-tests/tests/visual/**/*-snapshots/**
          retention-days: 14
          if-no-files-found: warn

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-diff
          path: packages/ui-tests/reports
          retention-days: 14
          if-no-files-found: ignore

  report:
    name: Merged UI report
    if: always()
    needs: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v8
        with:
          path: packages/ui-tests/blob-report
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge shard reports
        run: npx playwright merge-reports --reporter=html,junit ./blob-report
        working-directory: packages/ui-tests
        env:
          # `merge-reports` builds its reporters from the command line and does
          # not inherit the `outputFile` set in playwright.config.ts, so without
          # this the JUnit reporter writes to stdout and no file is produced.
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: reports/e2e-junit.xml

      - uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: packages/ui-tests/playwright-report
          retention-days: 14

      - name: Publish results
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: UI results
          path: packages/ui-tests/reports/*.xml
          reporter: java-junit
          # `fail-on-empty` is deliberately left at its default. A missing
          # report means the merge step above is broken, which is worth failing
          # the build for, and it is how the missing JUnit output was caught.
          # `fail-on-error` is off because a genuine test failure is already
          # reported by the job that ran the tests.
          fail-on-error: false
