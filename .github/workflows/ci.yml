name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # A nightly full run against the deployed environments, which catches drift
    # in either application that no commit of ours would have triggered.
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      uiBaseUrl:
        description: 'Book Store environment to test'
        required: false
        default: 'https://demoqa.com'
      apiBaseUrl:
        description: 'Restful Booker environment to test'
        required: false
        default: 'https://restful-booker.herokuapp.com'
      browsers:
        description: 'Comma separated: chromium, firefox, webkit'
        required: false
        default: 'chromium'

env:
  E2E_BASE_URL: ${{ inputs.uiBaseUrl || vars.E2E_BASE_URL || 'https://demoqa.com' }}
  BOOKER_BASE_URL: ${{ inputs.apiBaseUrl || vars.BOOKER_BASE_URL || 'https://restful-booker.herokuapp.com' }}
  # Both services are shared public deployments that occasionally drop a
  # request. One retry keeps the pipeline usable; the flaky count in the report
  # keeps that honest.
  E2E_RETRIES: '1'
  BOOKER_RETRIES: '1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Everything that needs no browser and no network, so a typo or a weakened
  # test fails in under a minute rather than after the full run.
  verify:
    name: Static checks, unit tests and mutation gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Stryker's incremental mode compares against the previous commit.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format

      - name: Unit tests
        run: npm run test:unit

      - name: Mutation gates
        run: npm run test:mutation

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-reports
          path: packages/*/reports/mutation
          retention-days: 14

  # Task 2. Runs alongside the browser suite rather than after it: the two
  # target different services and neither can affect the other.
  api:
    name: API suite (Restful Booker)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # No browsers are installed for this job. That saving is the reason the
      # two suites are separate workspace packages.
      - run: npm ci

      - name: Run API suite
        run: npm run test:api

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-report
          path: packages/api-tests/reports
          retention-days: 14

  # Task 1.
  e2e:
    name: UI suite (${{ matrix.browser }} shard ${{ matrix.shard }}/2)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The nightly run widens to every engine the application supports; a
        # pull request pays only for Chromium.
        browser: ${{ fromJSON(github.event_name == 'schedule' && '["chromium","firefox","webkit"]' || '["chromium"]') }}
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install browser
        run: npx playwright install --with-deps ${{ matrix.browser }}
        working-directory: packages/ui-tests

      - name: Run suite
        run: npx playwright test --shard=${{ matrix.shard }}/2
        working-directory: packages/ui-tests
        env:
          E2E_BROWSERS: ${{ matrix.browser }}

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.browser }}-${{ matrix.shard }}
          path: packages/ui-tests/blob-report
          retention-days: 14

  report:
    name: Merged UI report
    if: always()
    needs: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          path: packages/ui-tests/blob-report
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge shard reports
        run: npx playwright merge-reports --reporter=html,junit ./blob-report
        working-directory: packages/ui-tests

      - uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: packages/ui-tests/playwright-report
          retention-days: 14

      - name: Publish results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: UI results
          path: packages/ui-tests/reports/*.xml
          reporter: java-junit
          fail-on-error: false
